[tox]
envlist = py311
isolated_build = true
skipsdist = false

[testenv]
description = Unit + integration suites against the pinned lockfile.
deps =
    -r{toxinidir}/requirements.txt
commands =
    pytest {posargs}

[testenv:lint]
description = lint-scaffold: static lint over app/ and tests/.
deps =
    -r{toxinidir}/requirements.txt
commands =
    ruff check app tests

[testenv:typecheck]
description = typecheck-scaffold: static type analysis over app/ and tests/.
deps =
    -r{toxinidir}/requirements.txt
commands =
    mypy app tests

[testenv:acceptance]
description = AT1-AT8 out-of-process HTTP acceptance checks against a started service.
deps =
    -r{toxinidir}/requirements.txt
commands =
    pytest -m acceptance {posargs}
