[pytest]
# Thin, authoritative pytest configuration.
#
# The substantive settings (addopts, markers, testpaths, strict mode) live in
# pyproject.toml under [tool.pytest.ini_options]; this file exists so a bare
# `pytest` run from any working directory resolves exactly one configuration
# source instead of silently picking up setup.cfg / tox.ini / pyproject.toml.
#
# IMPORTANT: pytest reads the FIRST configuration file it finds in the rootdir
# probe order (pytest.ini > pyproject.toml > tox.ini > setup.cfg).  A bare
# `[pytest]` section here therefore deliberately declares NO settings that
# duplicate pyproject.toml: doing so would silently override the pinned
# addopts and markers with a stale copy.
addopts =
testpaths = tests
norecursedirs = .git .ruff_cache build dist *.egg-info data
markers =
    integration: persistence and storage-failure suites
