# setup.cfg is intentionally limited to tool configuration that must exist at
# the repository root for the installed stack:
#
#   * [options]      -> editable install metadata for `pip install -e .`
#   * [options.package_data] / [options.exclude_package_data]
#                     -> keeps the SQLite data directory and caches out of any
#                        built distribution
#   * [coverage:run] -> coverage source selection for `coverage run`
#
# It deliberately declares NO [tool:pytest], [mypy] or [flake8] section: pytest
# is configured in pytest.ini (empty, deferring to pyproject.toml), mypy and ruff
# are configured in pyproject.toml, and a second competing definition here
# would be the classic duplicate-configuration hazard.
[metadata]
license_files = LICENSE

[options]
zip_safe = False
include_package_data = False

[options.package_data]
app = *.py

[options.exclude_package_data]
* =
    __pycache__
    *.py[cod]
    data

[coverage:run]
branch = True
source = app
